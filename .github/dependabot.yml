version: 2

# Maintenance mode: ViTransfer takes security patches weekly and little else.
# Everything targets dev; the weekly-security-release workflow promotes dev to
# main.
#
# Major version updates are ignored everywhere: in maintenance mode a runtime
# or framework major is not worth the churn. The release run's
# `npm audit --audit-level=high` surfaces an advisory whose only fix is a major.
updates:
  - package-ecosystem: npm
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      # One PR a week for routine churn, one for advisories.
      npm:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - patch
          - minor
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        applies-to: version-updates
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: "/"
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: docker
    groups:
      docker:
        applies-to: version-updates
        patterns: ["*"]
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
