name: "CodeQL Analysis"

# Direct pushes to dev are scanned; dependabot pushes are skipped below because
# the PR already scanned that commit. main is not scanned on push — it only
# receives dev through a release merge, which was scanned on the way in.
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 6 * * 1" # Weekly Monday 06:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: github.event_name != 'push' || github.event.head_commit.author.name != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python, actions]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
