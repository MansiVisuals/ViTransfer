name: Dependabot Auto-merge

# Queues Dependabot PRs for merge once the dev integration tests pass.
# `gh pr merge --auto` only merges after the required checks on dev succeed,
# so this never bypasses the 19 clean-install and 22 upgrade tests.

on:
  pull_request:
    branches: [dev]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Queue for auto-merge
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether this update may merge unattended
        id: decide
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ALERT_STATE: ${{ steps.meta.outputs.alert-state }}
        run: |
          allow=false
          reason="major version bumps are never merged unattended"

          # Every configured ecosystem takes patch and minor unattended; the
          # 19 clean-install and 22 upgrade tests are the real gate. Majors
          # are blocked regardless, including security ones, because a major
          # can change behaviour in ways the suite would not catch.
          if [ "$UPDATE_TYPE" != "version-update:semver-major" ]; then
            # fetch-metadata reports the advisory-database name, so npm
            # arrives as npm_and_yarn rather than npm.
            case "$ECOSYSTEM" in
              npm|npm_and_yarn|github_actions|docker)
                allow=true
                reason="$ECOSYSTEM ${UPDATE_TYPE#version-update:semver-}"
                [ -n "$ALERT_STATE" ] && reason="$reason, closes an advisory ($ALERT_STATE)"
                ;;
              *)
                # An ecosystem not in dependabot.yml should never merge itself.
                reason="unrecognised ecosystem: $ECOSYSTEM"
                ;;
            esac
          fi

          echo "allow=$allow" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "Decision: allow=$allow ($reason)"

      - name: Enable auto-merge
        if: steps.decide.outputs.allow == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Flag for manual review
        if: steps.decide.outputs.allow != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REASON: ${{ steps.decide.outputs.reason }}
        run: |
          gh pr edit "$PR_URL" --add-label "needs-manual-review"
          gh pr comment "$PR_URL" --body \
            "Left open for a human: $REASON. Merge by hand once you have checked the upstream release notes."
