name: Docker Integration Tests

# PR only. Running on push to dev as well meant every merged PR ran the full
# suite twice over identical code. Changes reach dev through PRs; a direct
# push is covered by the release run's pre-publish check.
#
# No paths filter: "Test Summary" is a required check on dev, and a required
# check that never runs leaves auto-merge pending forever.
on:
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    name: Dev Clean Install Test
    uses: ./.github/workflows/test-dev-clean-install.yml

  upgrade-test:
    name: Dev Upgrade Test
    needs: clean-install
    uses: ./.github/workflows/test-dev-upgrade.yml

  summary:
    name: Test Summary
    needs: [clean-install, upgrade-test]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "=== Docker Integration Test Results ==="
          echo ""
          echo "Clean Install: ${{ needs.clean-install.result }}"
          echo "Upgrade Test:  ${{ needs.upgrade-test.result }}"
          echo ""

          if [[ "${{ needs.clean-install.result }}" == "success" ]] && \
             [[ "${{ needs.upgrade-test.result }}" == "success" ]]; then
            echo "[OK] All tests passed!"
          else
            echo "[ERROR] Some tests failed"
            exit 1
          fi
