name: Weekly Security Release

# Maintenance-mode release train. Dependabot lands security patches on dev
# through the week; this promotes them to main, publishes multi-arch images
# and cuts a release. Quiet weeks are skipped, so versions stay meaningful.
#
# Publishing waits on the `release` environment, so the whole run pauses for a
# human approval before anything reaches Docker Hub.

on:
  schedule:
    - cron: "0 8 * * 1" # Monday 08:00 UTC, after Dependabot's 05:00 run
  workflow_dispatch:
    inputs:
      force:
        description: "Release even if dev has no new commits"
        type: boolean
        default: false

permissions:
  contents: read

env:
  IMAGE: mansivisuals/vitransfer

jobs:
  check:
    name: Check for pending patches
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.diff.outputs.should_release }}
      next_version: ${{ steps.version.outputs.next }}
      notes: ${{ steps.diff.outputs.notes }}
      dev_sha: ${{ steps.diff.outputs.dev_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Find what is unreleased
        id: diff
        run: |
          git fetch origin main dev --tags --quiet

          # Measure against the last release tag, not main. main is only equal
          # to the last release when nothing has reached it outside this
          # workflow, and anything already on main is invisible in a main..dev
          # range — that is how the 1.2.7 notes lost the sidebar.
          #
          # Sort by version rather than using git describe: release tags sit on
          # main's merge commit, which is not an ancestor of dev, so describe
          # walks past them and finds a much older tag.
          base=$(git tag --sort=-v:refname | head -1)
          if [ -z "$base" ]; then
            base=$(git rev-list --max-parents=0 origin/dev | tail -1)
            echo "No tags yet, using the root commit as the base"
          fi
          echo "Comparing against $base"

          # Pin the rest of the run to this exact commit. Dependabot can
          # auto-merge into dev while the tests are running, and re-reading
          # origin/dev later would ship a commit that no notes describe.
          dev_sha=$(git rev-parse origin/dev)
          echo "dev_sha=$dev_sha" >> "$GITHUB_OUTPUT"
          echo "Pinned to dev at $dev_sha"

          count=$(git rev-list --count "$base"..origin/dev)
          echo "dev has $count unreleased commit(s)"

          if [ "$count" -eq 0 ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to release this week."
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

          # Squash-merged Dependabot PRs land as single commits; their subjects
          # are the release notes.
          {
            echo "notes<<__NOTES__"
            git log --no-merges --format='- %s' "$base"..origin/dev
            echo "__NOTES__"
          } >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: version
        if: steps.diff.outputs.should_release == 'true'
        run: |
          # Read from main, not the dev checkout: the bump is committed on main
          # only, so dev's VERSION deliberately lags behind the released one.
          current=$(git show origin/main:VERSION | tr -d '\n\r')

          # A prepared-but-never-tagged version ships as itself. Bumping past
          # it would skip a version and orphan its changelog entry.
          if git rev-parse -q --verify "refs/tags/v$current" >/dev/null; then
            next=$(echo "$current" | awk -F. '{printf "%d.%d.%d", $1, $2, $3 + 1}')
            echo "v$current is already released, bumping"
          else
            next="$current"
            echo "v$current was never tagged, releasing it as-is"
          fi

          echo "current=$current  next=$next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Audit for anything Dependabot missed
        if: steps.diff.outputs.should_release == 'true'
        run: |
          npm ci --legacy-peer-deps --ignore-scripts
          # Majors and unfixable advisories never reach auto-merge, so this is
          # the backstop that makes them visible rather than silently skipped.
          npm audit --audit-level=high || echo "::warning::npm audit reports unresolved advisories — review before approving"

  # Individual PRs are tested against dev as it was when they opened, not
  # against the final merged state. With no human approving the release, this
  # verifies the exact tree about to ship. Upgrade coverage stays at PR level,
  # where schema changes would actually arrive.
  verify-clean-install:
    name: Verify clean install
    needs: check
    if: needs.check.outputs.should_release == 'true'
    uses: ./.github/workflows/test-dev-clean-install.yml
    with:
      # The pinned SHA, not the dev branch: tests must cover the tree that
      # publish will merge, not whatever dev has drifted to since.
      ref: ${{ needs.check.outputs.dev_sha }}

  publish:
    name: Publish release
    needs: [check, verify-clean-install]
    if: needs.check.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Everything happens on main. dev is protected by a required check that
      # github-actions[bot] cannot satisfy on a direct push, so committing the
      # bump there would be rejected. dev never modifies VERSION, so the next
      # merge into main keeps main's value without conflict.
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge dev into main
        env:
          VERSION: ${{ needs.check.outputs.next_version }}
          DEV_SHA: ${{ needs.check.outputs.dev_sha }}
        run: |
          git fetch origin dev --quiet
          echo "Merging the commit that check evaluated and verify tested: $DEV_SHA"
          git merge --no-ff "$DEV_SHA" -m "Merge dev into main for v$VERSION release"

      - name: Bump version and changelog
        env:
          VERSION: ${{ needs.check.outputs.next_version }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          echo "$VERSION" > VERSION
          npm version "$VERSION" --no-git-tag-version --allow-same-version

          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const path = "CHANGELOG.md";
            const body = fs.readFileSync(path, "utf8");

            // A version prepared by hand already has its entry written; adding
            // a second heading for the same version would be wrong.
            if (body.includes(`## [${version}]`)) {
              console.log(`::notice::CHANGELOG already has an entry for ${version}, leaving it alone`);
              process.exit(0);
            }

            const date = new Date().toISOString().slice(0, 10);
            const entry = `## [${version}] - ${date}\n\nSecurity release: dependency updates.\n\n### Security\n${process.env.NOTES.trim()}\n\n`;
            const marker = "\n## [";
            const at = body.indexOf(marker);
            if (at === -1) throw new Error("no existing release heading in CHANGELOG.md");
            fs.writeFileSync(path, body.slice(0, at + 1) + entry + body.slice(at + 1));
          '

          git add VERSION package.json package-lock.json CHANGELOG.md
          # Releasing an already-prepared version leaves nothing to commit.
          if git diff --cached --quiet; then
            echo "Version and changelog already correct for $VERSION"
          else
            git commit -m "$VERSION: weekly security patches"
          fi

          git push origin main

  # One native runner per architecture. Building arm64 under QEMU on an amd64
  # runner took over three hours and had to be cancelled; native arm64 runners
  # are free for public repos and remove the emulation entirely. Each job pushes
  # an untagged image by digest, and the manifest job joins them under the tags.
  build:
    name: Build ${{ matrix.platform }}
    needs: [check, publish]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          no-cache: true # release builds never carry stale layers
          build-args: |
            APP_VERSION=${{ needs.check.outputs.next_version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          # Strip the algorithm prefix; the manifest step puts it back when it
          # rebuilds the reference, and leaving it here would double it up.
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  manifest:
    name: Publish manifest and release
    needs: [check, publish, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Create and push the manifest
        env:
          VERSION: ${{ needs.check.outputs.next_version }}
        run: |
          cd /tmp/digests
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Verify both architectures are present
        env:
          VERSION: ${{ needs.check.outputs.next_version }}
        run: |
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "$IMAGE:$VERSION" --raw \
              | grep -q "\"architecture\":\"$arch\"" \
              || { echo "::error::$arch missing from the published manifest"; exit 1; }
            echo "  $arch present"
          done

      - name: Publish GitHub release
        # Last, so the post-release jobs below test images that are already on
        # Docker Hub.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.next_version }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          printf '%s\n\n%s\n\n%s\n' \
            "Weekly security patch release. ViTransfer is in maintenance mode: security updates only." \
            "$NOTES" \
            "Upgrade with \`docker compose pull && docker compose up -d\`." > notes.md

          gh release create "v$VERSION" \
            --target main \
            --title "v$VERSION" \
            --notes-file notes.md

  # A release published with GITHUB_TOKEN does not fire the `release: published`
  # trigger, so this is called directly. It pulls from Docker Hub and is the
  # only check that the published manifest actually runs.
  post-release-clean-install:
    name: Post-release clean install
    needs: manifest
    uses: ./.github/workflows/test-clean-install.yml
    with:
      ref: main

  report-failure:
    name: Report failure
    needs: [check, verify-clean-install, publish, build, manifest, post-release-clean-install]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.check.outputs.next_version }}
          PUBLISHED: ${{ needs.manifest.result }}
        run: |
          # Whether the images are already live changes what needs doing, so
          # say which side of publish this failed on.
          if [ "$PUBLISHED" = "success" ]; then
            severity="Images for v$VERSION are already on Docker Hub, including \`:latest\`. A post-release check failed, so the published image may be broken — consider retagging \`:latest\` to the previous version."
          else
            severity="Nothing was published. Docker Hub and the release are untouched, so a re-run is safe once the cause is fixed."
          fi

          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Weekly security release failed ($(date -u +%Y-%m-%d))" \
            --label "ci" \
            --body "$(printf '%s\n\n%s\n\nRun: %s' "The weekly security release run did not complete." "$severity" "$RUN_URL")"
